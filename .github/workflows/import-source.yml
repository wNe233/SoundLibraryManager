name: Import complete 1.0.0 source

on:
  push:
    paths:
      - ".github/workflows/import-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and unpack release source
        run: |
          curl --fail --location --output /tmp/sound-library-source.zip             "https://github.com/wNe233/SoundLibraryManager/releases/download/v1.0.0/SoundLibraryManager-1.0.0-source.zip"
          rm -rf /tmp/sound-library-source
          mkdir -p /tmp/sound-library-source
          unzip -q /tmp/sound-library-source.zip -d /tmp/sound-library-source
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/sound-library-source/ ./

      - name: Commit complete source tree
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.invalid"
          git add -A
          if git diff --cached --quiet; then
            if [ "$(git log -1 --format=%an)" = "OpenAI Codex" ]; then
              exit 0
            fi
            git commit --allow-empty -m "Finalize SoundLibraryManager 1.0.0 source"
          else
            git commit -m "Import complete SoundLibraryManager 1.0.0 source"
          fi
          git push origin HEAD:main

      - name: Point release tag at complete source
        run: |
          git tag --force v1.0.0 HEAD
          git push --force origin refs/tags/v1.0.0
